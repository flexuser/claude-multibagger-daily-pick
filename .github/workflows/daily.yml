name: Daily multibagger + swing scan

on:
  workflow_dispatch:
    inputs:
      max_fetch:
        description: "Max fundamentals to refresh (multibagger)"
        default: "150"
      max_scan:
        description: "Max tickers for short-term / swing scan"
        default: "150"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run offline tests
        run: |
          python tests/test_signals.py
          python tests/test_diligence.py
          python tests/test_scoring.py
          python tests/test_validate.py
          python tests/test_pipeline.py
          python tests/test_short_term.py

      - name: Run multibagger scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py --max-fetch "${{ github.event.inputs.max_fetch || '150' }}"

      - name: Run short-term / swing scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py --short --max-scan "${{ github.event.inputs.max_scan || '150' }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push